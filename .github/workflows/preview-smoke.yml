name: Vercel Preview Smoke

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check health and deterministic fallback
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
          BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          test -n "$BYPASS_SECRET"
          curl --silent --show-error --location --fail --retry 5 --retry-delay 5 \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            "$BASE_URL/api/health" > /tmp/health.json
          node -e "const h=require('/tmp/health.json');if(h.status!=='ok')process.exit(1)"
          curl --silent --show-error --location --fail --retry 3 \
            -H "x-vercel-protection-bypass: $BYPASS_SECRET" \
            -H 'content-type: application/json' \
            --data '{"query":"下午想坐一会写东西，最好安静一点"}' \
            "$BASE_URL/api/recommend" > /tmp/recommend.sse
          grep -q 'event: recommendations' /tmp/recommend.sse
          grep -q 'event: done' /tmp/recommend.sse
          node -e "const fs=require('fs');const blocks=fs.readFileSync('/tmp/recommend.sse','utf8').split(/\r?\n\r?\n/);const read=n=>JSON.parse(blocks.find(b=>b.startsWith('event: '+n+'\n')).split(/\r?\n/).find(l=>l.startsWith('data: ')).slice(6));const a=read('recommendations').selectedCafeIds;const b=read('done').selectedCafeIds;if(a.length!==2||JSON.stringify(a)!==JSON.stringify(b))process.exit(1)"
