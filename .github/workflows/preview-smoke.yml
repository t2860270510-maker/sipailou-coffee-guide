name: Vercel Preview Smoke

on:
  deployment_status:

permissions:
  contents: read
  deployments: read

jobs:
  smoke:
    if: github.event.deployment_status.state == 'success' && github.event.deployment_status.environment_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Check health and deterministic fallback
        env:
          BASE_URL: ${{ github.event.deployment_status.environment_url }}
        run: |
          curl --fail --retry 5 --retry-delay 5 "$BASE_URL/api/health"
          curl --fail --retry 3 -H 'content-type: application/json' --data '{"query":"下午想坐一会写东西，最好安静一点"}' "$BASE_URL/api/recommend" | tee /tmp/recommend.sse
          grep -q 'event: recommendations' /tmp/recommend.sse
          grep -q 'event: done' /tmp/recommend.sse
